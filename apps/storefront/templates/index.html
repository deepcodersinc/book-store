{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Second-hand classics, carefully kept</h1>
  <p>Paperbacks, hardcovers, and instant downloads.</p>
</section>
<div class="grid">
  {% for book in books %}
  <article class="card">
    <a href="/books/{{ book.slug }}"><img src="{{ cover_url(book) }}" alt="{{ book.title }}"></a>
    <h3><a href="/books/{{ book.slug }}">{{ book.title }}</a></h3>
    <p class="author">{{ book.author }}</p>
    <p class="price">from {{ book.price_from_cents | money }}</p>
  </article>
  {% endfor %}
</div>
{% endblock %}
