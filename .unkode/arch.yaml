  version: 1

architecture:
  - name: Customer Storefront
    path: apps/storefront
    kind: frontend
    tech: [Python, FastAPI, Jinja2]
    role: Server-rendered shop where customers browse books, manage a cart, check out and view their orders.
    depends_on: [Business Services, Shared Web Toolkit]

  - name: Staff Console
    path: apps/admin
    kind: frontend
    tech: [Python, FastAPI, Jinja2]
    role: Back-office pages for staff to manage books, inventory, orders, fulfilment jobs, the message outbox and the audit log.
    depends_on: [Business Services, Shared Web Toolkit, Fulfilment Worker]

  - name: Public API
    path: apps/api
    kind: backend
    tech: [Python, FastAPI]
    role: JSON endpoints for the catalogue, ebook downloads and the Stripe payment webhook.
    depends_on: [Business Services, Third-Party Integrations]

  - name: Business Services
    path: services
    kind: backend
    tech: [Python]
    role: Domain logic for the bookshop, sitting between the web layer and the data repositories.
    depends_on: [Data Access Layer, Third-Party Integrations, Domain Schemas]
    components:
      - name: Catalog
        path: services/catalog
        description: Looks up books, their physical and digital editions, and bestseller lists.
        depends_on: [Data Access Layer > Book Repository, Third-Party Integrations > File Storage, Domain Schemas]
      - name: Checkout & Pricing
        path: services/checkout
        description: Manages guest and signed-in carts, prices them and turns them into paid orders.
        depends_on: [Catalog, Inventory, Orders, Payments, Customer Identity, Data Access Layer > Cart Repository, Domain Schemas]
      - name: Orders
        path: services/orders
        description: Creates orders and moves them through their lifecycle.
        depends_on: [Notifications, Fulfilment Jobs, Data Access Layer > Order Repository, Domain Schemas]
      - name: Payments
        path: services/payments
        description: Charges customers through Stripe and reconciles webhook events with orders.
        depends_on: [Orders, Notifications, Data Access Layer > Order Repository, Data Access Layer > Payment Repository, Third-Party Integrations > Payment Client, Domain Schemas]
      - name: Fulfilment Jobs
        path: services/fulfillment
        description: Queues fulfilment work and manages download grants for ebooks.
        depends_on: [Data Access Layer > Fulfilment Repository]
      - name: Inventory
        path: services/inventory
        description: Tracks stock levels for physical editions.
        depends_on: [Data Access Layer > Inventory Repository]
      - name: Customer Identity
        path: services/identity
        description: Registers and authenticates customers and manages sessions.
        depends_on: [Data Access Layer > Customer Repository, Domain Schemas]
      - name: Notifications
        path: services/notifications
        description: Records and sends transactional emails and text messages to customers.
        depends_on: [Customer Identity, Data Access Layer > Outbox Repository, Third-Party Integrations > Email Client, Third-Party Integrations > SMS Client]
      - name: Audit Trail
        path: services/audit
        description: Records staff actions for the audit log.
        depends_on: [Data Access Layer > Audit Log Repository]

  - name: Data Access Layer
    path: data
    kind: library
    tech: [Python, SQLite]
    role: Owns the database schema and connection, and exposes one repository per domain area.
    depends_on: [Bookstore Database]
    components:
      - name: Database Connection & Schema
        path: data/db.py
        description: Opens the database connection, runs queries and creates the schema.
        depends_on: [Bookstore Database]
      - name: Book Repository
        path: data/books.py
        description: Reads and writes books and editions, and ranks bestsellers from paid orders.
        depends_on: [Database Connection & Schema]
      - name: Inventory Repository
        path: data/inventory.py
        description: Reads and adjusts stock levels for physical editions.
        depends_on: [Database Connection & Schema]
      - name: Customer Repository
        path: data/customers.py
        description: Stores customer accounts and login sessions.
        depends_on: [Database Connection & Schema]
      - name: Cart Repository
        path: data/carts.py
        description: Persists carts for signed-in shoppers.
        depends_on: [Database Connection & Schema]
      - name: Order Repository
        path: data/orders.py
        description: Stores orders, their line items and status changes.
        depends_on: [Database Connection & Schema]
      - name: Payment Repository
        path: data/payments.py
        description: Stores payment and refund records.
        depends_on: [Database Connection & Schema]
      - name: Fulfilment Repository
        path: data/fulfillment.py
        description: Stores shipments, ebook download grants and the background job queue.
        depends_on: [Database Connection & Schema]
      - name: Outbox Repository
        path: data/notifications.py
        description: Records every email and text message sent to customers.
        depends_on: [Database Connection & Schema]
      - name: Audit Log Repository
        path: data/audit.py
        description: Stores the audit trail of staff actions.
        depends_on: [Database Connection & Schema]

  - name: Third-Party Integrations
    path: integrations
    kind: library
    tech: [Python]
    role: Clients for payments, email, text messages and object storage that fall back to local mocks when no credentials are set.
    depends_on: [Stripe, SendGrid, Twilio, Object Storage]
    components:
      - name: Payment Client
        path: integrations/stripe_client.py
        description: Creates charges and refunds and verifies payment webhook signatures.
        depends_on: [Stripe]
      - name: Email Client
        path: integrations/email_client.py
        description: Sends transactional emails.
        depends_on: [SendGrid]
      - name: SMS Client
        path: integrations/sms_client.py
        description: Sends text messages.
        depends_on: [Twilio]
      - name: File Storage
        path: integrations/storage.py
        description: Resolves and reads cover images and ebook files from a bucket or local disk.
        depends_on: [Object Storage]

  - name: Shared Web Toolkit
    path: packages/web
    kind: library
    tech: [Python, Jinja2]
    role: Shared templating setup, base layout and form helpers used by the storefront and staff console.

  - name: Domain Schemas
    path: packages/schemas
    kind: library
    tech: [Python, Pydantic]
    role: Shared data models for books, carts, customers, orders, payments and fulfilment.

  - name: Fulfilment Worker
    path: workers/fulfillment
    kind: worker
    tech: [Python]
    role: Drains the job queue, granting ebook downloads or shipping physical copies and reconciling inventory.
    depends_on: [Business Services, Data Access Layer, Domain Schemas]

  - name: Operations CLI
    path: tools/cli
    kind: cli
    tech: [Python]
    role: Command-line tool for seeding the database and running fulfilment from the terminal.
    depends_on: [Business Services, Data Access Layer, Fulfilment Worker]
    components:
      - name: Command Runner
        path: tools/cli/__main__.py
        description: Parses terminal commands and dispatches them to seeding, stock and fulfilment operations.
        depends_on: [Demo Data Seeder, Business Services > Catalog, Business Services > Fulfilment Jobs, Business Services > Inventory, Business Services > Orders, Data Access Layer > Database Connection & Schema, Fulfilment Worker]
      - name: Demo Data Seeder
        path: tools/cli/seeder.py
        description: Loads the demo catalogue, customer accounts and order history.
        depends_on: [Business Services > Customer Identity, Data Access Layer > Book Repository, Data Access Layer > Customer Repository, Data Access Layer > Inventory Repository, Data Access Layer > Order Repository, Data Access Layer > Payment Repository]

  - name: Bookstore Database
    type: external
    kind: database
    role: Stores the catalogue, carts, orders, payments, inventory and the job queue.

  - name: Stripe
    type: external
    kind: api
    role: Payment gateway for card charges, refunds and payment webhooks.

  - name: SendGrid
    type: external
    kind: api
    role: Delivers transactional customer emails.

  - name: Twilio
    type: external
    kind: api
    role: Sends customers shipping updates by text message.

  - name: Object Storage
    type: external
    kind: storage
    role: S3-compatible bucket for cover images and ebook files, with the local filesystem as the fallback.

deployment:
  - name: Web App Container
    tech: [Docker Compose, uvicorn]
    role: Serves the storefront, staff console and public API as one ASGI app on port 8000.
    hosts: [Customer Storefront, Staff Console, Public API]
    depends_on: [PostgreSQL, Redis, MinIO]

  - name: Fulfilment Worker Container
    tech: [Docker Compose]
    role: Runs the fulfilment loop through the operations CLI.
    hosts: [Fulfilment Worker, Operations CLI]
    depends_on: [PostgreSQL]

  - name: PostgreSQL
    tech: [Docker Compose, postgres:16]
    role: Database server declared in the compose topology.
    hosts: [Bookstore Database]

  - name: Redis
    tech: [Docker Compose, redis:7]
    role: Cache server declared in the compose topology but not used by any code.

  - name: MinIO
    tech: [Docker Compose, minio]
    role: S3-compatible object store for covers and ebook files.
    hosts: [Object Storage]
